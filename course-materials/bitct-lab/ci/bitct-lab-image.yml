# Builds and publishes course lab images to GitHub Container Registry, then runs the runtime lab checks.
# Copy to .github/workflows/ of davidepatti/bitct; its allowlisted kit is in course-materials/bitct-lab/.
# After the first successful run, open the package page on GitHub (Packages → bitct-lab → Package settings)
# and set its visibility to Public so students can pull without logging in.
name: bitct-lab image

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Image tag (course edition)"
        default: "2026.10"
        required: true
      push:
        description: "Push to ghcr.io"
        type: boolean
        default: true
      checks_only:
        description: "Test the published image without rebuilding"
        type: boolean
        default: false
  pull_request:
    paths: ["course-materials/bitct-lab/**", ".github/workflows/bitct-lab-image.yml"]

permissions:
  contents: read
  packages: write

env:
  KIT: course-materials/bitct-lab
  IMAGE: ghcr.io/${{ github.repository_owner }}/bitct-lab

jobs:
  build:
    if: ${{ !inputs.checks_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Course image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.KIT }}/image
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
          tags: ${{ env.IMAGE }}:${{ inputs.edition || '2026.10' }}
          build-args: BITCT_EDITION=${{ inputs.edition || '2026.10' }}
      - name: Graph-learning variant (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.KIT }}/image
          target: ml
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
          tags: ${{ env.IMAGE }}:${{ inputs.edition || '2026.10' }}-ml
          build-args: BITCT_EDITION=${{ inputs.edition || '2026.10' }}

  labs:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.checks_only)) }}
    runs-on: ubuntu-latest
    env:
      BITCT_IMAGE: ghcr.io/${{ github.repository_owner }}/bitct-lab:${{ inputs.edition || '2026.10' }}
    strategy:
      fail-fast: false
      matrix:
        lab: [dlab00-setup, dlab01-auth, dlab02-transaction, dlab03-structures, dlab04-consensus,
              dlab05-wallet, dlab06-attest, dlab07-anchor, dlab08-channel, dlab09-routing, dlab11-esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image locally for this runner
        if: ${{ !inputs.checks_only }}
        run: docker buildx build --load --target runtime -t "$BITCT_IMAGE" ${{ env.KIT }}/image
      - name: Pull the published image anonymously
        if: ${{ inputs.checks_only }}
        run: docker pull "$BITCT_IMAGE"
      - name: Run the student procedure
        run: python3 ${{ env.KIT }}/tests/run_lab.py ${{ matrix.lab }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-${{ matrix.lab }}
          path: ${{ env.KIT }}/tests/out/${{ matrix.lab }}/
