# DLAB 11 — ESP32 sensor readings anchored on Bitcoin
# Generated by tools/gen_compose.py — start with: docker compose up -d --wait
name: bitct-dlab11

services:
  node-a:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: node-a
    command: ["bitcoind"]
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["node-a:/data"]
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcconnect=127.0.0.1", "getblockchaininfo"]
      interval: 3s
      timeout: 5s
      retries: 40
  miner:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["miner"]
    environment: {MINER_NODE: node-a, MINER_INTERVAL: "${MINER_INTERVAL:-30}"}
    restart: "no"
    networks: [lab]
    depends_on: {node-a: {condition: service_healthy}}
  broker:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["broker"]
    hostname: broker
    restart: "no"
    networks: [lab]
  gateway:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["gateway"]
    hostname: gateway
    restart: unless-stopped
    environment:
      GROUP: "${GROUP:?set GROUP in the .env file}"
      MQTT_HOST: "${MQTT_HOST:-broker.hivemq.com}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      BATCH_SECONDS: "${BATCH_SECONDS:-60}"
      ANCHOR_NETWORK: regtest
      BTC_RPC_HOST: node-a
    networks: [lab, edge]
    volumes: ["d17:/data/d17"]
    depends_on: {node-a: {condition: service_healthy}}
  device-sim:
    # optional virtual meter: docker compose --profile sim up -d
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["device-sim", "--interval", "15"]
    profiles: [sim]
    restart: "no"
    environment:
      GROUP: "${GROUP:?set GROUP in the .env file}"
      MQTT_HOST: "${MQTT_HOST:-broker.hivemq.com}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
    networks: [lab, edge]
    volumes: ["d17:/data/d17"]
  lab:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: lab
    command: ["shell"]
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/lab-ready"]
      interval: 2s
      retries: 90
    environment:
      LAB_ID: "dlab11-esp32"
      LAB_TITLE: "DLAB 11 — ESP32 sensor readings anchored on Bitcoin"
      DASH_NODES: "node-a"
      D17_DB: "/data/d17/collector.sqlite"
      GROUP: "${GROUP:?set GROUP in the .env file}"
      MQTT_HOST: "${MQTT_HOST:-broker.hivemq.com}"
    networks: [lab, edge]
    volumes: ["lab-home:/lab", "d17:/data/d17"]
    depends_on: {node-a: {condition: service_healthy}}
  dashboard:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["dashboard"]
    restart: "no"
    environment:
      LAB_ID: "dlab11-esp32"
      LAB_TITLE: "DLAB 11 — ESP32 sensor readings anchored on Bitcoin"
      DASH_NODES: "node-a"
      D17_DB: "/data/d17/collector.sqlite"
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:8080"]
    networks: [lab, edge]
    volumes: ["d17:/data/d17"]
    depends_on: {node-a: {condition: service_healthy}}

networks:
  lab:
    internal: true   # nodes never reach the Internet
  edge: {}

volumes:
  node-a: {}
  lab-home: {}
  d17: {}
