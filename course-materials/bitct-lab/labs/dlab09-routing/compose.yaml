# DLAB 09 — Routing with hidden liquidity
# Generated by tools/gen_compose.py — start with: docker compose up -d --wait
name: bitct-dlab09

services:
  node-a:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: node-a
    command: ["bitcoind"]
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["node-a:/data"]
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcconnect=127.0.0.1", "getblockchaininfo"]
      interval: 3s
      timeout: 5s
      retries: 40
  alice:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: alice
    command: ["lnd"]
    environment: {LND_ALIAS: alice, LND_BITCOIND: node-a}
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["alice:/data"]
    depends_on: {node-a: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "--lnddir=/data/lnd", "getinfo"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
  bob:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: bob
    command: ["lnd"]
    environment: {LND_ALIAS: bob, LND_BITCOIND: node-a}
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["bob:/data"]
    depends_on: {node-a: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "--lnddir=/data/lnd", "getinfo"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
  carol:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: carol
    command: ["lnd"]
    environment: {LND_ALIAS: carol, LND_BITCOIND: node-a}
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["carol:/data"]
    depends_on: {node-a: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "--lnddir=/data/lnd", "getinfo"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
  dave:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: dave
    command: ["lnd"]
    environment: {LND_ALIAS: dave, LND_BITCOIND: node-a}
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["dave:/data"]
    depends_on: {node-a: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "lncli", "--network=regtest", "--lnddir=/data/lnd", "getinfo"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
  lab:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: lab
    command: ["shell"]
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/lab-ready"]
      interval: 2s
      retries: 90
    environment:
      LAB_ID: "dlab09-routing"
      LAB_TITLE: "DLAB 09 — Routing with hidden liquidity"
      DASH_NODES: "node-a"
      DASH_LN: "alice,bob,carol,dave"
    networks: [lab]
    volumes: ["lab-home:/lab", "alice:/ln/alice:ro", "bob:/ln/bob:ro", "carol:/ln/carol:ro", "dave:/ln/dave:ro"]
    depends_on: {node-a: {condition: service_healthy}, alice: {condition: service_healthy}, bob: {condition: service_healthy}, carol: {condition: service_healthy}, dave: {condition: service_healthy}}
  dashboard:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["dashboard"]
    restart: "no"
    environment:
      LAB_ID: "dlab09-routing"
      LAB_TITLE: "DLAB 09 — Routing with hidden liquidity"
      DASH_NODES: "node-a"
      DASH_LN: "alice,bob,carol,dave"
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:8080"]
    networks: [lab, edge]
    volumes: ["alice:/ln/alice:ro", "bob:/ln/bob:ro", "carol:/ln/carol:ro", "dave:/ln/dave:ro"]
    depends_on: {node-a: {condition: service_healthy}, alice: {condition: service_healthy}, bob: {condition: service_healthy}, carol: {condition: service_healthy}, dave: {condition: service_healthy}}

networks:
  lab:
    internal: true   # nodes never reach the Internet
  edge: {}

volumes:
  node-a: {}
  alice: {}
  bob: {}
  carol: {}
  dave: {}
  lab-home: {}
