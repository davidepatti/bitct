# DLAB 07 — Sensor records and Merkle anchoring
# Generated by tools/gen_compose.py — start with: docker compose up -d --wait
name: bitct-dlab07

services:
  node-a:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: node-a
    command: ["bitcoind"]
    restart: "no"
    stop_grace_period: 30s
    networks: [lab]
    volumes: ["node-a:/data"]
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcconnect=127.0.0.1", "getblockchaininfo"]
      interval: 3s
      timeout: 5s
      retries: 40
  lab:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    hostname: lab
    command: ["shell"]
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/lab-ready"]
      interval: 2s
      retries: 90
    environment:
      LAB_ID: "dlab07-anchor"
      LAB_TITLE: "DLAB 07 — Sensor records and Merkle anchoring"
      DASH_NODES: "node-a"
      LAB_SETUP: "mkdir -p /lab/records && cp -n /usr/share/bitct/dlab07/* /lab/records/"
    networks: [lab]
    volumes: ["lab-home:/lab"]
    depends_on: {node-a: {condition: service_healthy}}
  dashboard:
    image: ${BITCT_IMAGE:-ghcr.io/davidepatti/bitct-lab:2026.10}
    command: ["dashboard"]
    restart: "no"
    environment:
      LAB_ID: "dlab07-anchor"
      LAB_TITLE: "DLAB 07 — Sensor records and Merkle anchoring"
      DASH_NODES: "node-a"
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:8080"]
    networks: [lab, edge]
    depends_on: {node-a: {condition: service_healthy}}

networks:
  lab:
    internal: true   # nodes never reach the Internet
  edge: {}

volumes:
  node-a: {}
  lab-home: {}
